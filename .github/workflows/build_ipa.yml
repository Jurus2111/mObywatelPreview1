name: Build IPA for AltStore

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen


      - name: Select Xcode 16
        run: |
          echo "=== Dostepne wersje Xcode ==="
          ls -d /Applications/Xcode*.app
          
          if [ -d "/Applications/Xcode_16.app" ]; then
            echo "Wybrano Xcode_16.app"
            echo "DEVELOPER_DIR=/Applications/Xcode_16.app/Contents/Developer" >> $GITHUB_ENV
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            echo "Wybrano Xcode_16.0.app"
            echo "DEVELOPER_DIR=/Applications/Xcode_16.0.app/Contents/Developer" >> $GITHUB_ENV
          else
            echo "Xcode 16 nieznaleziony, uzywam domyslnego"
          fi

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Build and Archive (No Code Signing)
        run: |
          xcodebuild archive \
            -project mObywatelPreview.xcodeproj \
            -scheme mObywatelPreview \
            -configuration Release \
            -archivePath build/mObywatelPreview.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -sdk iphoneos

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/mObywatelPreview.xcarchive/Products/Applications/mObywatelPreview.app Payload/
          zip -r mObywatelPreview.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mObywatelPreview-IPA
          path: mObywatelPreview.ipa
